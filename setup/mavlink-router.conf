# Installed to /etc/mavlink-router/main.conf by setup/full_setup.sh.

[General]
TcpServerPort = 0

[UartEndpoint pixhawk]
Device = /dev/serial0
Baud = 921600

# MavlinkTagController2 binds this port (see crontab-start-controller.sh)
[UdpEndpoint controller]
Mode = Normal
Address = 127.0.0.1
Port = 14540

# Server mode transmits nothing on WiFi until a GCS sends to it
[UdpEndpoint wifi_gcs]
Mode = Server
Address = 0.0.0.0
Port = 14550
