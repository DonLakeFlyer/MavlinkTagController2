name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  decimator:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            install_deps: >-
              sudo apt-get update && sudo apt-get install -y
              build-essential cmake pkg-config
              libboost-system-dev libboost-thread-dev libboost-filesystem-dev
              libzmq3-dev libusb-1.0-0-dev libairspyhf-dev
          - os: macos-latest
            install_deps: brew install cmake pkg-config boost zeromq libusb airspyhf

    name: c++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: ${{ matrix.install_deps }}

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug --output-on-failure

  detector:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python-version: ['3.11', '3.12']

    name: detector-simulator-python (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          ./setup_venv.sh

      - name: Syntax check
        run: |
          source .venv/bin/activate
          python -m py_compile detector/pulse_detector.py
          python -m py_compile simulator/iq_simulator.py
          python -m py_compile analyzer/flight_checks.py
          python -m py_compile analyzer/iq_replay.py

      - name: Validate help output
        run: |
          source .venv/bin/activate
          cd detector
          python pulse_detector.py --help

      - name: Detector tests
        run: |
          source .venv/bin/activate
          python -m pytest detector/tests/ -v --tb=short

      - name: Simulator tests
        run: |
          source .venv/bin/activate
          python -m pytest simulator/tests/ -v --tb=short

      - name: Analyzer tests
        run: |
          source .venv/bin/activate
          python -m pytest analyzer/tests/ -v --tb=short
